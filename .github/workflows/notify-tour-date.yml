name: Notify on new tour date

# Fires whenever content/tour.json changes on main — i.e. the band added or
# edited a show in Decap (/admin/). Pings Jon (via his normal repo
# notifications) to run the "What to Do in [City]" blog prompt for the new
# date. Uses the built-in GITHUB_TOKEN — no SMTP secrets, nothing to
# authenticate, so it can't fail on credentials.
#
# ONE reminder issue, not one per save. Every change lands as a comment on the
# single open reminder issue, and a new issue is opened only when none is open
# (close it when you're caught up and the next save starts a fresh one).
# It used to open a new issue per save: the band saving six times in nine
# minutes on 2026-11-12 tripped GitHub's limit on rapid issue creation, the
# sixth run failed, and 14 identical issues piled up. Any duplicates still open
# get closed automatically, pointing at the one that's kept.
on:
  push:
    branches: [main]
    paths:
      - "content/tour.json"

permissions:
  contents: read
  issues: write

jobs:
  notify-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo (need parent commit for the diff)
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Build the tour.json change summary
        id: diff
        run: |
          {
            echo "diff<<EOF"
            git diff HEAD^ HEAD -- content/tour.json || echo "(no diff available)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post the reminder
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_BY: ${{ github.event.head_commit.author.name }}
          COMMIT_WHEN: ${{ github.event.head_commit.timestamp }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          DIFF: ${{ steps.diff.outputs.diff }}
        run: |
          TITLE="🎸 New/updated tour date on The British Invasion Years"

          cat > body.md <<EOF
          The band just changed the Tour Dates in Decap.

          Commit:  $COMMIT_MSG
          By:      $COMMIT_BY
          When:    $COMMIT_WHEN
          Commit:  $COMMIT_URL

          \`\`\`diff
          $DIFF
          \`\`\`

          If this is a NEW show, open Claude Code in the project folder and run:
            "Create a 'What to Do in [City]' blog post for the new tour date
             and wire it to that tour card's whatToDoSlug."
          EOF

          # A burst of saves can still hit a rate limit, so back off and retry
          # instead of failing the run on the first refusal.
          retry() {
            for i in 1 2 3 4; do
              "$@" && return 0
              echo "Attempt $i failed, waiting $((i * 30))s"
              sleep $((i * 30))
            done
            return 1
          }

          # Open reminder issues, newest first. Keep the newest, fold the rest.
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\") | .number] | sort | reverse | .[]")
          KEEP=$(echo "$OPEN" | head -n 1)

          if [ -z "$KEEP" ]; then
            retry gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md
          else
            retry gh issue comment "$KEEP" --repo "$GITHUB_REPOSITORY" --body-file body.md
            for n in $(echo "$OPEN" | tail -n +2); do
              retry gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
                --comment "Folded into #$KEEP. All tour date reminders go there now." || true
            done
          fi
